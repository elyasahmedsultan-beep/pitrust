          type: object
          properties:
            badgeAuditId: { type: string, format: uuid }
            billingMonth: { type: string, format: date }
          required: [badgeAuditId, billingMonth]
      required: [intentId, amount, memo, metadata]
    MonthlyBadgeStatus:
      type: object
      properties:
