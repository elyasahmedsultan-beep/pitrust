          type: number
          minimum: 0
          exclusiveMaximum: 100
          description: Current seller-side payout fee in percentage points; 3 means 3 percent.
        memo: { type: string }
        metadata:
          type: object
          properties:
            contractId: { type: string }
            feeType: { type: string, enum: [dispute] }
          required: [contractId]
      required: [contractId, amount, memo, metadata]
    Listing:
