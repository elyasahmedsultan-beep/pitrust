        contractId: { type: string, format: uuid }
        decision: { type: string, enum: [release, refund] }
        payoutIntentId: { type: string, format: uuid }
        status: { type: string, enum: [creating, created, submitting, submitted, completing, confirmed, manual_reconciliation, failed] }
        paymentId: { type: ["string", "null"] }
        txid: { type: ["string", "null"] }
      required: [disputeId, contractId, decision, payoutIntentId, status, paymentId, txid]
