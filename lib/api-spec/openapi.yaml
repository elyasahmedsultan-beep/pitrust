        createdAt: { type: string, format: date-time }
      required: [id, title, description, amount, currency, pipeline, metadata, createdAt]
    ListingInput:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string }
        amount: { type: number, exclusiveMinimum: 0 }
        currency: { type: string, pattern: "^(?:[Pp][Ii]|[A-Za-z]{3})$" }
        pipeline: { type: string, enum: [digital, shippable, local_property, custom_terms] }
        metadata: { type: object, additionalProperties: true }
      required: [title, description, amount, currency, pipeline, metadata]
    ListingContractInput:
      type: object
      properties:
        dueDate: { type: string, format: date }
