    EvidenceConfirmationInput:
      type: object
      properties:
        category: { type: string, enum: [receipt, deed, title, deliverable] }
        filename: { type: string, minLength: 1, maxLength: 255 }
        contentType:
          type: string
          enum: [application/pdf, image/avif, image/gif, image/jpeg, image/png, image/webp]
        sizeBytes: { type: integer, minimum: 1, maximum: 10485760 }
        objectKey: { type: string, minLength: 1, maxLength: 2048 }
      required: [category, filename, contentType, sizeBytes, objectKey]
    EvidenceUploadUrl:
      type: object
      properties:
        uploadUrl: { type: string, format: uri }
